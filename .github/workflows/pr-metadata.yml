name: PR metadata
run-name: PR ${{ github.event.pull_request.number }} metadata

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/pr-metadata.yml@20533b678728ec119e52401c1e48b31f3c8b83c4 # v1.32.5
    with:
      runs-on: ubuntu-latest
      harden: true
      check-acceptance: false

  # A pull request that closes an issue shows evidence for each of its acceptance criteria. Checks
  # only pull requests with a closing keyword (enforce-all-prs: false), because this repository takes
  # outside and bot pull requests. Check run: `ac-evidence / Acceptance evidence`.
  ac-evidence:
    # The reusable fails on any event but pull_request; this workflow runs on pull requests only.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/ac-evidence.yml@20533b678728ec119e52401c1e48b31f3c8b83c4 # v1.32.5

  pr-metadata-success:
    name: pr-metadata-success
    needs: [metadata, ac-evidence]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both metadata checks to succeed
        env:
          METADATA: ${{ needs.metadata.result }}
          ACCEPTANCE: ${{ needs.ac-evidence.result }}
        run: |
          if [[ "$METADATA" != success || "$ACCEPTANCE" != success ]]; then
            echo "metadata=$METADATA acceptance=$ACCEPTANCE"
            exit 1
          fi
