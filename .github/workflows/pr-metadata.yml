name: PR metadata
run-name: PR ${{ github.event.pull_request.number }} metadata

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/pr-metadata.yml@36b5178e7fac9278288b7a5ded0f1fc4c9deb7f5 # v1.30.24
    with:
      runs-on: ubuntu-latest
      harden: true
      check-acceptance: false

  # Keep the tracker-recognised acceptance caller and its existing policy.
  metadata-acceptance:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/ac-evidence.yml@36b5178e7fac9278288b7a5ded0f1fc4c9deb7f5 # v1.30.24

  pr-metadata-success:
    name: pr-metadata-success
    needs: [metadata, metadata-acceptance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both metadata checks to succeed
        env:
          METADATA: ${{ needs.metadata.result }}
          ACCEPTANCE: ${{ needs.metadata-acceptance.result }}
        run: |
          if [[ "$METADATA" != success || "$ACCEPTANCE" != success ]]; then
            echo "metadata=$METADATA acceptance=$ACCEPTANCE"
            exit 1
          fi
