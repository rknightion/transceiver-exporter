# golangci-lint v2 configuration.
version: "2"

linters:
  # "standard" includes errcheck, govet, ineffassign, staticcheck, and unused.
  default: standard
  enable:
    - gosec
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # Tests exercise hostile inputs and use testing helpers that terminate the test.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
